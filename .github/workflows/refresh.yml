name: Refresh FPL data

on:
  schedule:
    - cron: "0 7 * * *"      #everyday @ 7:00
  workflow_dispatch: {}       

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Load players, teams and gameweeks
        run: python ingestion/load_bootstrap.py
      - name: Load fixtures
        run: python ingestion/load_fixtures.py
      - name: Load player history
        run: python ingestion/load_player_history.py
      - name: Generate predictions
        run: python ingestion/predict_next.py
      - name: Lock down tables
        run: python ingestion/secure_tables.py